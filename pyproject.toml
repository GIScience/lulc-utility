[project]
name = "lulc-utility"
version = "1.1.1"
description = "This utility provides various LULC classifications"
authors = [
    {name = "Maciej Adamiak", email = "maciej.adamiak@heigit.org"},
    {name = "Moritz Schott", email = "moritz.schott@heigit.org"},
    {name = "Danielle Gatland", email = "danielle.gatland@heigit.org"}
]
readme = "README.md"
repository = "https://gitlab.heigit.org/climate-action/utilities/lulc-utility.git"
requires-python = ">=3.13,<3.14"
dependencies = [
    "geocube>=0.7.1,<1",
    "geopandas>=1.1.1,<2",
    "hydra-core>=1.3.2,<2",
    "matplotlib>=3.10.6,<4",
    "minio>=7.2.16,<8",
    "neptune>=1.14.0,<2",
    "numpy>=2.3.2,<3",
    "ohsome>=0.4.0,<1",
    "omegaconf>=2.3.0,<3",
    "pandas>=2.3.2,<3",
    "pillow>=12,<13",
    "pyarrow>=21.0.0,<22",
    "pydantic>=2.11.7,<3",
    "pyproj>=3.7.2,<4",
    "pyyaml>=6.0.2,<7",
    "rasterio>=1.4.3,<2",
    "sentinelhub>=3.11.1,<4",
    "shapely>=2.1.1,<3",
]

[dependency-groups]
dev = [
    "albumentations>=2.0.8,<3",
    "contextily>=1.6.2,<2",
    "coolname>=2.2.0,<3",
    "geopy>=2.4.1,<3",
    "lightning>=2.5.5,<3",
    "onnx>=1.19.0,<2",
    "pre-commit>=4.3.0,<5",
    "pyjoules>=0.5.1,<1",
    "scikit-learn>=1.7.2,<2",
    "seaborn>=0.13.2,<1",
    "torch>=2.8.0,<3",
    "torchvision>=0.23.0,<1",
    "transformers>=4.56.1,<5",
    "tqdm>=4.67.1,<5",
]
test = [
    "httpx>=0.28.1,<1",
    "pytest>=8.4.2,<9",
    "pytest-cov>=7,<8",
]
deploy = [
    "fastapi>=0.116.1,<1",
    "onnxruntime>=1.22.1,<2",
    "scipy>=1.16.1,<2",
    "starlette>=0.47.3,<1",
    "uvicorn>=0.35.0,<1",
    "webcolors>=24.11.1,<25",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules
select=[
    # defaults
    "F",
    "E4", "E7", "E9",

    # additional
    "A", # be sure not to shadow built-in functions
    "I", # isort to sort imports
    "N", # check for use of PEP8 naming conventions

    # docstring cleaning
    "D201", "D207", "D208", "D209", "D210", "D214", "D215", "D300", "D403",

    # auto-remove unused 'noqa' comments
    "RUF100", "RUF101",
]

[tool.pytest.ini_options]
markers = [
    "external: marks tests that potentially make external API calls (deselect with '-m \"not external\"')",
]

[tool.coverage.run]
omit = ["test/*"]

[tool.uv.build-backend]
module-root = ""
module-name = "app"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"
